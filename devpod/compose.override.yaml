# This is the override file for the dev container.
# https://code.visualstudio.com/docs/devcontainers/create-dev-container#_extend-your-docker-compose-file-for-development
services:
  rails-app:
    # Resource limits (optional - adjust based on your system)
    # cpus: 8
    # mem_limit: 16g
    # memswap_limit: 16g

    volumes:
      # SSH keys for git push/pull AND commit signing are mounted via the
      # devpod-data/ssh persistent volume (see devpod/README.md). No GPG mount
      # needed — git is configured for SSH commit signing.

      # Persist `gh` CLI auth across container restarts (avoids re-running
      # `gh auth login` every time). Adjust the host path to match where your
      # devpod-data sibling lives (same dir as your other devpod-data mounts).
      - ~/GitHubRepos/devpod-data/gh:/home/vscode/.config/gh

      # GitHub App private key + app-id, so bin/gh-app-token can open PRs as
      # the app rather than falling back to the user's own gh credentials.
      - ~/GitHubRepos/devpod-data/gh-app:/home/vscode/.config/escrowsafe:ro

      # Rollbar access token
      - ~/GitHubRepos/devpod-data/rollbar/.rollbar-mcp.json:/home/vscode/.rollbar-mcp.json:ro

      # Mount personal preferences / settings (optional and experimental, use at your own risk as it might involve some level of debugging :P)
      #
      # - ~/.claude/CLAUDE.md:/home/vscode/.claude/CLAUDE.md:ro
      # - ~/agent-os:/home/vscode/agent-os:ro

  chrome:
    # macOS Screen Sharing holds a launchd socket on 5900, so the raw VNC port
    # is republished on 5901. `!override` replaces the port list rather than
    # merging into it, which would leave the conflicting 5900 binding in place.
    # The noVNC viewer on 7900 is unaffected.
    ports: !override
      - "4444:4444"
      - "7900:7900"
      - "5901:5900"
