name: financial_planning
root: <%= ENV["PROJECT_DIR"] %>/financial_planning
# needed for pane-base-index 1 config
startup_pane: 1

windows:
  - editor:
      # claude on top (~80% height); bottom split in half:
      # serve.py on the left (so to-do ticks save), empty shell on the right
      layout: 37a8,214x52,0,0[214x41,0,0,20,214x10,0,42{107x10,0,42,21,106x10,108,42,22}]
      panes:
        - claude
        - python3 scripts/serve.py
        -
