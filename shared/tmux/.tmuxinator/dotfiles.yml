# ~/.tmuxinator/dotfiles.yml

name: dotfiles
root: <%= "#{ENV['PROJECT_DIR']}/dotfiles" %>
# needed for pane-base-index 1 config
startup_pane: 1

windows:
  - editor:
      # wide claude pane on the left; right side split between nvim and a shell
      layout: 1dc9,187x47,0,0{117x47,0,0,6,69x47,118,0[69x38,118,0,7,69x8,118,39,13]}
      panes:
        - claude
        - nvim .
        -
